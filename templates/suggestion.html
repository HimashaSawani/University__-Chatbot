{% extends 'base.html' %}

{% block content %}
    <div class="suggestion-container">
        <h2>Suggestions</h2>
        <form action="{{ url_for('suggestion') }}" method="POST">
            <label for="suggestion">Your Suggestion:</label>
            <textarea id="suggestion" name="suggestion" required></textarea>

            <button type="submit" class="btn">Submit Suggestion</button>
        </form>
    </div>
{% endblock %}
